[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-mcp-server"
version = "0.1.0"
description = "MCP verification services for life insurance beneficiary change requests."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastmcp>=3.2.3,<4",
]

[project.scripts]
simple-mcp-server = "simple_mcp_server.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
simple_mcp_server = ["data/*.json"]
