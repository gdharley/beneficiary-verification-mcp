[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beneficiary-verification-mcp"
version = "0.1.0"
description = "MCP verification services for life insurance beneficiary change requests."
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
  "fastmcp>=3.2.3,<4",
]

[project.scripts]
beneficiary-verification-mcp = "beneficiary_verification.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
beneficiary_verification = ["data/*.json"]
