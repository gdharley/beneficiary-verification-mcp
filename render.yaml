services:
  - type: web
    name: beneficiary-verification-mcp
    runtime: python
    plan: free
    buildCommand: pip install .
    startCommand: beneficiary-verification-mcp
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.7"
      - key: HOST
        value: 0.0.0.0
      - key: MCP_AUTH_TOKEN
        sync: false
